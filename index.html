<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Summer Countdown</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --card: #161616;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --muted: #555;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 20px 80px;
    }

    .glyph {
      display: flex;
      gap: 6px;
      margin-bottom: 52px;
    }
    .glyph span {
      display: block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #fff;
      transition: opacity 0.3s;
    }
    .glyph span.dim    { opacity: 0.12; }
    .glyph span.mid    { opacity: 0.4; }
    .glyph span.bright { opacity: 1; }

    .header {
      width: 100%;
      max-width: 520px;
      margin-bottom: 40px;
    }

    .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .eyebrow::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    h1 {
      font-family: 'DM Mono', monospace;
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 300;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .sub {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-top: 8px;
    }

    .countdown {
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }

    .unit {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px 12px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .number {
      font-family: 'DM Mono', monospace;
      font-size: clamp(2.2rem, 7vw, 3.2rem);
      font-weight: 300;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1;
      min-width: 2ch;
      text-align: center;
    }

    .number.flip { animation: numflip 0.25s ease; }
    @keyframes numflip {
      0%  { opacity: 1; transform: translateY(0); }
      45% { opacity: 0; transform: translateY(-5px); }
      55% { opacity: 0; transform: translateY(5px); }
      100%{ opacity: 1; transform: translateY(0); }
    }

    .unit-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .progress-wrap {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 40px;
    }

    .progress-track {
      flex: 1;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
    }

    .progress-fill {
      height: 100%;
      background: var(--text);
      border-radius: 2px;
      transition: width 1s linear;
    }

    .progress-pct {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      min-width: 42px;
      text-align: right;
    }

    .summer-msg {
      display: none;
      font-family: 'DM Mono', monospace;
      font-size: 1.8rem;
      font-weight: 300;
      color: var(--text);
      letter-spacing: 0.06em;
      margin-bottom: 40px;
    }

    .section-eye {
      width: 100%;
      max-width: 520px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-eye::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .chat {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .chat-status {
      padding: 12px 16px !important;
      font-size: 11px !important;
      padding: 8px 16px;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @keyframes ping {
      0%   { box-shadow: 0 0 0 0 #4caf5066; }
      70%  { box-shadow: 0 0 0 8px #4caf5000; }
      100% { box-shadow: 0 0 0 0 #4caf5000; }
    }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s;
    }
    .status-dot.live { background: #4caf50; animation: ping 1.8s ease infinite; }
    .status-dot.error { background: #f44336; }

    .chat-messages {
      height: 280px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chat-messages::-webkit-scrollbar { width: 3px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .empty-state {
      margin: auto;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-align: center;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 75%;
      animation: msgIn 0.2s ease both;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    .msg.me    { align-self: flex-end; align-items: flex-end; }
    .msg.other { align-self: flex-start; align-items: flex-start; }

    .msg-name {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 300;
      line-height: 1.55;
    }

    .msg.me .msg-bubble {
      background: var(--text);
      color: #0d0d0d;
    }

    .msg.other .msg-bubble {
      background: #1f1f1f;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .chat-inputs {
      border-top: 1px solid var(--border);
      background: #111;
      display: flex;
      align-items: stretch;
    }

    .chat-inputs input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.04em;
      padding: 16px;
      caret-color: var(--text);
      min-width: 0;
    }

    .chat-inputs input::placeholder { color: var(--muted); }

    .name-input {
      width: 110px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
    }

    .msg-input { flex: 1; }

    .send-btn {
      background: none;
      border: none;
      border-left: 1px solid var(--border);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 16px 18px;
      cursor: pointer;
      transition: color 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .send-btn:hover { color: var(--text); }

    @media (max-width: 440px) {
      .countdown { grid-template-columns: repeat(2, 1fr); }
      .name-input { width: 80px; }
    }
  </style>
</head>
<body>

<div class="glyph">
  <span class="bright"></span><span class="dim"></span><span class="mid"></span>
  <span class="dim"></span><span class="bright"></span><span class="dim"></span>
  <span class="mid"></span><span class="bright"></span><span class="dim"></span>
  <span class="mid"></span><span class="dim"></span><span class="bright"></span>
</div>

<div class="header">
  <div class="eyebrow">Countdown</div>
  <h1>Summer Break</h1>
  <div class="sub" id="currentDate"></div>
</div>

<div class="summer-msg" id="summerMsg">it's summer.</div>

<div class="countdown" id="countdown">
  <div class="unit"><div class="number" id="days">00</div><div class="unit-label">Days</div></div>
  <div class="unit"><div class="number" id="hours">00</div><div class="unit-label">Hours</div></div>
  <div class="unit"><div class="number" id="minutes">00</div><div class="unit-label">Minutes</div></div>
  <div class="unit"><div class="number" id="seconds">00</div><div class="unit-label">Seconds</div></div>
</div>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-track">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="progress-pct" id="pct">0.0%</div>
</div>

<div class="section-eye">Global Chat</div>

<div class="chat">
  <div class="chat-status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">connecting...</span>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="empty-state" id="emptyState">no messages yet.</div>
  </div>
  <div class="chat-inputs">
    <input class="name-input" id="nameInput" type="text" placeholder="your name" maxlength="18" autocomplete="off"/>
    <input class="msg-input" id="msgInput" type="text" placeholder="say something..." maxlength="200" autocomplete="off"/>
    <button class="send-btn" id="sendBtn">send</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, serverTimestamp, query, limitToLast }
    from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

  // ── Firebase config ──
  const firebaseConfig = {
    apiKey: "AIzaSyCtNKRUJ4B7ktgun7iBBJs7WM6UQ4NX1Ws",
    authDomain: "project-chat-9fa39.firebaseapp.com",
    databaseURL: "https://project-chat-9fa39-default-rtdb.firebaseio.com",
    projectId: "project-chat-9fa39",
    storageBucket: "project-chat-9fa39.firebasestorage.app",
    messagingSenderId: "443248777092",
    appId: "1:443248777092:web:fd8492e69628f767ef6fd1"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const msgsRef = query(ref(db, 'messages'), limitToLast(60));

  // ── Status indicator ──
  const dot      = document.getElementById('statusDot');
  const statusTx = document.getElementById('statusText');

  // ── Live current date ──
  function updateDate() {
    const now = new Date();
    const str = now.toLocaleDateString([], { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' })
      + ' · ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('currentDate').textContent = str + '  ·  target Jun 26, 2026 2:20 PM';
  }
  updateDate();
  setInterval(updateDate, 1000);

  // ── Glyph pulse ──
  const glyphDots = document.querySelectorAll('.glyph span');
  setInterval(() => {
    const i = Math.floor(Math.random() * glyphDots.length);
    const d = glyphDots[i];
    const was = d.style.opacity;
    d.style.opacity = '0.7';
    setTimeout(() => { d.style.opacity = was; }, 350);
  }, 700);

  // ── Countdown ──
  const TARGET = new Date(2026, 5, 26, 14, 20, 0); // June 26 2026 2:20 PM local time
  const START  = new Date(2025, 8,  5,  8,  0, 0); // Sep 5 2025 local time
  const TOTAL  = TARGET - START;

  const numEls = {
    days:    document.getElementById('days'),
    hours:   document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    seconds: document.getElementById('seconds'),
  };
  let prev = {};

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now  = new Date();
    const diff = TARGET - now;

    if (diff <= 0) {
      clearInterval(timer);
      document.getElementById('countdown').style.display = 'none';
      document.getElementById('progressWrap').style.display = 'none';
      document.getElementById('summerMsg').style.display = 'block';
      return;
    }

    const totalSecs = Math.floor(diff / 1000);
    const d = Math.floor(totalSecs / 86400);
    const h = Math.floor((totalSecs % 86400) / 3600);
    const m = Math.floor((totalSecs % 3600) / 60);
    const s = totalSecs % 60;

    const vals = {
      days:    pad(d),
      hours:   pad(h),
      minutes: pad(m),
      seconds: pad(s),
    };

    for (const k in vals) {
      if (vals[k] !== prev[k]) {
        numEls[k].textContent = vals[k];
        numEls[k].classList.remove('flip');
        void numEls[k].offsetWidth;
        numEls[k].classList.add('flip');
      }
    }
    prev = { ...vals };

    const pct = Math.min(100, Math.max(0, ((now - START) / TOTAL) * 100));
    document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
    document.getElementById('pct').textContent = pct.toFixed(1) + '%';
  }

  // Run immediately and every second
  tick();
  const timer = setInterval(tick, 1000);
  window.addEventListener('focus', tick); // re-sync when tab regains focus

  // ── Chat render ──
  let lastCount = 0;

  onValue(msgsRef, (snapshot) => {
    dot.classList.add('live');
    statusTx.textContent = 'live · global';

    const box    = document.getElementById('chatMessages');
    const myName = document.getElementById('nameInput').value.trim().toLowerCase();
    const data   = snapshot.val();

    box.innerHTML = '';

    if (!data) {
      const e = document.createElement('div');
      e.className = 'empty-state';
      e.textContent = 'no messages yet.';
      box.appendChild(e);
      lastCount = 0;
      return;
    }

    const msgs = Object.values(data);
    const isNew = msgs.length > lastCount;
    lastCount = msgs.length;

    msgs.forEach(m => {
      const isMe = myName && m.name.toLowerCase() === myName;

      const wrap   = document.createElement('div');
      wrap.className = 'msg ' + (isMe ? 'me' : 'other');

      const name   = document.createElement('div');
      name.className = 'msg-name';
      name.textContent = m.name + ' · ' + m.time;

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = m.text;

      wrap.appendChild(name);
      wrap.appendChild(bubble);
      box.appendChild(wrap);
    });

    if (isNew) box.scrollTop = box.scrollHeight;
  }, (err) => {
    dot.classList.remove('live'); dot.classList.add('error'); statusTx.textContent = 'connection error — check firebase rules';
    console.error(err);
  });

  // ── Send ──
  function sendMessage() {
    const nameEl = document.getElementById('nameInput');
    const msgEl  = document.getElementById('msgInput');
    const name   = nameEl.value.trim() || 'anon';
    const text   = msgEl.value.trim();
    if (!text) return;

    push(ref(db, 'messages'), {
      name,
      text,
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      ts: serverTimestamp(),
    });

    msgEl.value = '';
  }

  document.getElementById('sendBtn').addEventListener('click', sendMessage);
  document.getElementById('msgInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

  // Persist name
  const saved = localStorage.getItem('summer_name_v3');
  if (saved) document.getElementById('nameInput').value = saved;
  document.getElementById('nameInput').addEventListener('input', e => {
    localStorage.setItem('summer_name_v3', e.target.value);
  });
</script>
  <div style="margin-top: 48px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: #333; text-align: center;">
    &lt;/&gt; CODED BY BERK :D 
  </div>
</body>
</html>
